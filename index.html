<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobRaksha - Is that job offer real?</title>
<meta name="description" content="Free scam check for job offers. Paste any WhatsApp forward, SMS, email or posting and get an instant verdict in English, Hindi or Malayalam.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#0b1120">
<style>
:root{
  --bg:#0b1120; --bg2:#0f1a2e; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --ink:#e8eef7; --mut:#93a1b5;
  --acc:#34d399; --acc2:#22d3ee; --warn:#fb7185; --mid:#fbbf24; --cau:#fde047; --ok:#34d399;
  --grad:linear-gradient(135deg,#34d399 0%,#22d3ee 100%);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(42rem 30rem at 12% -8%,rgba(52,211,153,.14),transparent 60%),
             radial-gradient(38rem 28rem at 105% 20%,rgba(34,211,238,.10),transparent 60%),
             radial-gradient(30rem 24rem at 50% 110%,rgba(251,113,133,.07),transparent 60%)}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.1rem 4rem;position:relative;z-index:1}

/* ---------- nav ---------- */
nav{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.2rem;letter-spacing:.2px}
.brand svg{width:30px;height:30px;flex:none}
.langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem;gap:.15rem}
.langs button{border:0;background:none;color:var(--mut);border-radius:999px;padding:.34rem .8rem;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s}
.langs button.on{background:var(--grad);color:#06281c}

/* ---------- hero ---------- */
.hero{text-align:center;padding:2.6rem 0 1.6rem}
.hero h1{font-size:clamp(1.9rem,5.5vw,2.9rem);line-height:1.14;font-weight:800;letter-spacing:-.02em}
.hero h1 .hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:34rem;margin:.9rem auto 0;font-size:1.02rem}
.badges{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin-top:1.2rem}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--mut);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.32rem .8rem}
.badge .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:1.25rem;padding:1.3rem;margin-top:1.2rem;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.glow{box-shadow:0 0 0 1px rgba(52,211,153,.12),0 18px 50px -20px rgba(0,0,0,.55)}

/* ---------- checker ---------- */
.checker textarea{width:100%;min-height:10rem;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:.9rem;padding:.95rem;font:inherit;font-size:1rem;color:var(--ink);resize:vertical;transition:border-color .2s, box-shadow .2s}
.checker textarea:focus{outline:none;border-color:rgba(52,211,153,.55);box-shadow:0 0 0 3px rgba(52,211,153,.13)}
.checker textarea::placeholder{color:#5c6b80}
.pnote{font-size:.78rem;color:var(--mut);margin-top:.75rem}
.row{display:flex;gap:.6rem;margin-top:.9rem;flex-wrap:wrap;align-items:center}
button.primary{background:var(--grad);color:#06281c;border:0;border-radius:.8rem;padding:.85rem 1.6rem;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .15s, box-shadow .2s;box-shadow:0 8px 24px -8px rgba(52,211,153,.5)}
button.primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px -8px rgba(52,211,153,.6)}
button.primary:disabled{opacity:.7;cursor:wait;transform:none}
button.ghost{background:none;border:1px solid var(--line);border-radius:.8rem;padding:.8rem 1.1rem;font-size:.9rem;cursor:pointer;color:var(--mut);transition:all .2s}
button.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}
.scanline{position:relative;overflow:hidden}
.scanline::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(52,211,153,.16) 50%,transparent 70%);transform:translateX(-100%);animation:scan 1s linear infinite}
@keyframes scan{to{transform:translateX(100%)}}

/* ---------- verdict ---------- */
#out{opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .45s ease}
#out.show{opacity:1;transform:none}
.vhead{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.gauge{position:relative;width:132px;height:132px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .track{stroke:rgba(255,255,255,.08)}
.gauge .arc{stroke:url(#ggrad);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)}
.gauge .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .num b{font-size:2rem;line-height:1}
.gauge .num span{font-size:.68rem;color:var(--mut);margin-top:.15rem}
.vinfo{flex:1;min-width:14rem}
.pill{display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.32rem .95rem;font-size:.9rem;font-weight:700;color:#08101d}
.pill svg{width:15px;height:15px}
.b-likely_scam{background:linear-gradient(135deg,#fb7185,#f43f5e)}
.b-suspicious{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.b-caution{background:linear-gradient(135deg,#fde047,#eab308)}
.b-no_signals{background:linear-gradient(135deg,#34d399,#10b981)}
.vtext{font-size:1.3rem;font-weight:800;margin-top:.55rem;letter-spacing:-.01em}
.vsub{color:var(--mut);font-size:.9rem;margin-top:.15rem}

/* ---------- signals ---------- */
.siggrid{display:grid;gap:.6rem;margin-top:1rem}
.sig{display:flex;gap:.7rem;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:.85rem;padding:.75rem .9rem;animation:rise .5s ease both}
.sig:nth-child(2){animation-delay:.06s}.sig:nth-child(3){animation-delay:.12s}.sig:nth-child(4){animation-delay:.18s}.sig:nth-child(5){animation-delay:.24s}.sig:nth-child(6){animation-delay:.3s}.sig:nth-child(n+7){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sig .ic{width:26px;height:26px;flex:none;border-radius:.55rem;display:flex;align-items:center;justify-content:center;background:rgba(251,113,133,.14);color:var(--warn)}
.sig .ic svg{width:15px;height:15px}
.sig .tx{font-size:.94rem}
.ev{display:inline-block;margin-top:.35rem;font-size:.78rem;color:var(--mid);background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.22);border-radius:.55rem;padding:.14rem .55rem;word-break:break-word}
h3.sec{font-size:.98rem;margin-top:1.2rem;display:flex;align-items:center;gap:.5rem}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}
.chip{font-size:.78rem;color:var(--acc2);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);border-radius:999px;padding:.18rem .7rem;word-break:break-all}

/* ---------- steps ---------- */
.steps{display:grid;gap:.7rem;margin-top:.8rem;list-style:none;padding:0}
.steps li{display:flex;gap:.8rem;align-items:flex-start}
.steps .n{flex:none;width:1.7rem;height:1.7rem;border-radius:.55rem;background:var(--grad);color:#06281c;font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.steps .s{font-size:.94rem;padding-top:.1rem}

/* ---------- misc ---------- */
.disc{font-size:.84rem;color:var(--mut);border-left:3px solid rgba(251,191,36,.5);padding-left:.7rem;margin-top:1.1rem}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mut);margin-top:1.1rem;flex-wrap:wrap;gap:.6rem}
.fb button{margin-left:.4rem}
.fb .ghost{padding:.45rem 1rem;font-size:.85rem}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-top:.9rem}
.how .h{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:.9rem}
.how .h b{display:block;font-size:.92rem;margin-bottom:.25rem}
.how .h p{font-size:.82rem;color:var(--mut)}
.how .hn{font-size:.7rem;font-weight:800;letter-spacing:.12em;color:var(--acc);text-transform:uppercase}
@media(max-width:560px){.how{grid-template-columns:1fr}}
footer{text-align:center;color:var(--mut);font-size:.8rem;margin-top:2.2rem;padding:0 1rem;max-width:36rem;margin-left:auto;margin-right:auto}
.hidden{display:none}
button.rec{border-color:rgba(251,113,133,.65);color:var(--warn);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.astat{color:var(--acc2)}
.abtn{font-size:.85rem;padding:.6rem .95rem}
</style>
</head>
<body>
<div class="wrap">

<nav>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3.5v5.2c0 5-3.4 9.4-8 10.8-4.6-1.4-8-5.8-8-10.8V5.5L12 2z" fill="url(#bg1)"/><path d="M8.5 12.2l2.3 2.3 4.7-4.8" stroke="#06281c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="bg1" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
    <span id="t-title"></span>
  </div>
  <div class="langs">
    <button data-lang="en" class="on">EN</button>
    <button data-lang="hi">हिं</button>
    <button data-lang="ml">മല</button>
  </div>
</nav>

<header class="hero">
  <h1 id="hero-h"></h1>
  <p id="t-intro"></p>
  <div class="badges">
    <span class="badge"><span class="dot"></span><span id="t-badge1"></span></span>
    <span class="badge"><span class="dot"></span><span id="t-badge2"></span></span>
    <span class="badge"><span class="dot"></span><span id="t-badge3"></span></span>
  </div>
</header>

<div class="card glow checker">
  <textarea id="inp"></textarea>
  <p class="pnote" id="t-callhint" style="margin-top:.6rem"></p>
  <div class="row">
    <button class="primary" id="go"></button>
    <button class="ghost" id="ex"></button>
  </div>
  <div class="row" id="audiorow">
    <button class="ghost abtn" id="mic"></button>
    <button class="ghost abtn" id="upl"></button>
    <input type="file" id="uplfile" accept="audio/*" class="hidden">
  </div>
  <p class="pnote astat" id="astat" hidden></p>
  <p class="pnote" id="t-audionote"></p>
  <p class="pnote" id="t-pnote"></p>
</div>

<div class="card hidden" id="out">
  <div class="vhead">
    <div class="gauge">
      <svg width="132" height="132" viewBox="0 0 132 132">
        <defs><linearGradient id="ggrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#fb7185"/>
        </linearGradient></defs>
        <circle class="track" cx="66" cy="66" r="56" fill="none" stroke-width="11"/>
        <circle class="arc" id="arc" cx="66" cy="66" r="56" fill="none" stroke-width="11" stroke-dasharray="351.86" stroke-dashoffset="351.86"/>
      </svg>
      <div class="num"><b id="scorenum">0</b><span id="t-scoreof"></span></div>
    </div>
    <div class="vinfo">
      <span class="pill" id="pill"></span>
      <div class="vtext" id="vtext"></div>
      <div class="vsub" id="vsub"></div>
    </div>
  </div>

  <div id="sigblock" class="hidden">
    <h3 class="sec" id="t-signals"></h3>
    <div class="siggrid" id="siglist"></div>
  </div>

  <div id="contactblock" class="hidden">
    <h3 class="sec" id="t-contacts"></h3>
    <div class="chips" id="contactlist"></div>
  </div>

  <div class="disc" id="t-disc"></div>

  <h3 class="sec" id="t-steps"></h3>
  <ol class="steps">
    <li><span class="n">1</span><span class="s" id="t-step1"></span></li>
    <li><span class="n">2</span><span class="s" id="t-step2"></span></li>
    <li><span class="n">3</span><span class="s" id="t-step3"></span></li>
  </ol>

  <div class="meta">
    <button class="ghost abtn hidden" id="listen"></button>
    <span id="countwrap" class="hidden"><span id="count"></span> <span id="t-count"></span></span>
    <span class="fb"><span id="t-helpful"></span>
      <button class="ghost" id="fby"></button><button class="ghost" id="fbn"></button>
    </span>
  </div>
</div>

<h3 class="sec" id="t-how" style="margin-top:1.6rem"></h3>
<div class="how">
  <div class="h"><span class="hn" id="t-how1n"></span><b id="t-how1t"></b><p id="t-how1d"></p></div>
  <div class="h"><span class="hn" id="t-how2n"></span><b id="t-how2t"></b><p id="t-how2d"></p></div>
  <div class="h"><span class="hn" id="t-how3n"></span><b id="t-how3t"></b><p id="t-how3d"></p></div>
</div>

<footer id="t-footer"></footer>
</div>

<script src="i18n.js"></script>
<script type="module">
import { analyze } from './engine.js';
let lang = localStorage.getItem('jr-lang') || 'en';
const $ = id => document.getElementById(id);
const EXAMPLES = {
  en: 'Congratulations! You are selected for Data Entry Work From Home at Amazon. No interview, direct joining. Salary Rs 45,000/month. Pay refundable registration fee of Rs 999 via UPI to confirm your slot today. Only 5 slots left! Contact HR on WhatsApp +919999999999 or hr.amazonjobs@gmail.com',
  hi: 'बधाई हो! आपका चयन Amazon में Data Entry Work From Home के लिए हुआ है। No interview, direct joining. सैलरी Rs 45,000/माह। आज ही UPI से Rs 999 की refundable registration fee देकर अपनी सीट पक्की करें। सिर्फ़ 5 सीटें बची हैं! HR से WhatsApp +919999999999 पर संपर्क करें',
  ml: 'Congratulations! Amazon-ൽ Data Entry Work From Home ജോലിക്ക് തിരഞ്ഞെടുത്തു. No interview, direct joining. ശമ്പളം Rs 45,000/മാസം. നിങ്ങളുടെ സീറ്റ് ഉറപ്പാക്കാൻ ഇന്ന് തന്നെ UPI വഴി Rs 999 refundable registration fee അടയ്ക്കൂ. 5 സീറ്റ് മാത്രം ബാക്കി! HR-മായി WhatsApp +919999999999-ൽ ബന്ധപ്പെടൂ'
};
const ICONS = {
  likely_scam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
  suspicious: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3l10 17H2L12 3z" stroke-linejoin="round"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  caution: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3l10 17H2L12 3z" stroke-linejoin="round"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  no_signals: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4 4L19 7"/></svg>'
};
const WARN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 17H2L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>';
function T(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
function paint(){
  document.documentElement.lang = lang;
  $('t-title').textContent = T('title');
  const tag = T('tagline');
  const cut = tag.indexOf('?');
  $('hero-h').innerHTML = cut > 0
    ? tag.slice(0, cut + 1) + '<br><span class="hl">' + tag.slice(cut + 1).trim() + '</span>'
    : tag;
  $('t-intro').textContent = T('intro');
  $('t-badge1').textContent = T('badge1');
  $('t-badge2').textContent = T('badge2');
  $('t-badge3').textContent = T('badge3');
  $('inp').placeholder = T('placeholder');
  $('go').textContent = T('analyze');
  $('ex').textContent = T('try_example');
  $('t-signals').textContent = T('signals_found');
  $('t-contacts').textContent = T('contacts_spotted');
  $('t-steps').textContent = T('next_steps');
  $('t-step1').textContent = T('step1');
  $('t-step2').textContent = T('step2');
  $('t-step3').textContent = T('step3');
  $('t-helpful').textContent = T('helpful_q');
  $('fby').textContent = T('yes'); $('fbn').textContent = T('no');
  $('t-count').textContent = T('checks_done');
  $('t-scoreof').textContent = T('score_caption') + ' /100';
  $('t-callhint').textContent = T('call_hint');
  if (!recording) $('mic').innerHTML = micIcon + T('audio_speak');
  $('upl').innerHTML = clipIcon + T('audio_upload');
  $('t-audionote').textContent = audioOK ? T('audio_note') : '';
  $('listen').innerHTML = spkIcon + (speaking ? T('tts_stop') : T('tts_listen'));
  $('t-pnote').textContent = T('privacy_note');
  $('t-how').textContent = T('how_title');
  for (let i = 1; i <= 3; i++) {
    $('t-how' + i + 'n').textContent = T('how' + i + 'n');
    $('t-how' + i + 't').textContent = T('how' + i + 't');
    $('t-how' + i + 'd').textContent = T('how' + i + 'd');
  }
  $('t-footer').textContent = T('footer');
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => {
  lang = b.dataset.lang; localStorage.setItem('jr-lang', lang);
  document.querySelectorAll('.langs button').forEach(x => x.classList.toggle('on', x === b));
  paint();
});
$('ex').onclick = () => { $('inp').value = EXAMPLES[lang] || EXAMPLES.en; $('inp').focus(); };
const CIRC = 351.86;
let counted = false;
const BAND_COLORS = { likely_scam: '#f43f5e', suspicious: '#f59e0b', caution: '#eab308', no_signals: '#34d399' };
function animateGauge(score, band){
  const arc = $('arc'), num = $('scorenum');
  arc.style.stroke = BAND_COLORS[band] || '#34d399';
  arc.style.strokeDashoffset = CIRC;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    arc.style.strokeDashoffset = CIRC * (1 - Math.min(100, score) / 100);
  }));
  const t0 = performance.now(), dur = 900;
  (function tick(t){
    const p = Math.min(1, (t - t0) / dur);
    num.textContent = Math.round(score * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}
$('go').onclick = async () => {
  if (!$('inp').value.trim()) { $('inp').focus(); return; }
  const go = $('go');
  go.disabled = true; go.textContent = T('analyzing');
  $('out').classList.add('hidden'); $('out').classList.remove('show');
  const card = document.querySelector('.checker');
  card.classList.add('scanline');
  const r = analyze($('inp').value);
  await new Promise(res => setTimeout(res, 650));
  card.classList.remove('scanline');
  go.disabled = false; go.textContent = T('analyze');

  $('pill').className = 'pill b-' + r.band;
  $('pill').innerHTML = ICONS[r.band] + '<span>' + (r.score >= 55 ? T('risk_high') : r.score >= 30 ? T('risk_medium') : r.score >= 12 ? T('risk_low') : T('risk_clear')) + '</span>';
  $('vtext').textContent = T('verdict_' + r.band);
  $('vsub').textContent = T('verdictsub_' + r.band);
  animateGauge(r.score, r.band);
  $('t-disc').textContent = T('disclaimer');

  const sl = $('siglist'); sl.innerHTML = '';
  if (r.signals.length) {
    $('sigblock').classList.remove('hidden');
    for (const s of r.signals) {
      const d = document.createElement('div'); d.className = 'sig';
      const ev = r.evidence && r.evidence[s];
      d.innerHTML = '<span class="ic">' + WARN_ICON + '</span><span class="tx">' + T('sig_' + s) +
        (ev ? '<br><span class="ev"></span>' : '') + '</span>';
      if (ev) d.querySelector('.ev').textContent = '“' + ev + '”';
      sl.appendChild(d);
    }
  } else $('sigblock').classList.add('hidden');

  const cl = $('contactlist'); cl.innerHTML = '';
  const seen = [...(r.contacts.emails || []), ...(r.contacts.hosts || [])];
  if (seen.length) {
    $('contactblock').classList.remove('hidden');
    for (const c of seen) { const s = document.createElement('span'); s.className = 'chip'; s.textContent = c; cl.appendChild(s); }
  } else $('contactblock').classList.add('hidden');

  stopSpeaking();
  $('out').classList.remove('hidden');
  refreshListen();
  requestAnimationFrame(() => $('out').classList.add('show'));
  if (!counted) { counted = true; try { const c = await fetch('/api/count', { method: 'POST' }); const j = await c.json(); if (j.count) { $('count').textContent = j.count; $('countwrap').classList.remove('hidden'); } } catch (e) {} }
  $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
};
// ---------- audio: speak / upload -> on-device transcript -> editable text ----------
const micIcon = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px;margin-right:.35rem"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const clipIcon = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px;margin-right:.35rem"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.85 1.85 0 0 1-2.6-2.6l7.8-7.8"/></svg>';
const spkIcon = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:.35rem"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg>';
const audioOK = typeof WebAssembly !== 'undefined' && !!(window.AudioContext || window.webkitAudioContext);
const micOK = audioOK && !!navigator.mediaDevices && typeof MediaRecorder !== 'undefined';
if (!audioOK) $('audiorow').classList.add('hidden');
if (!micOK) $('mic').classList.add('hidden');
let recording = false, discardRequested = false, audioBusy = false;
let rec = null, recChunks = [], recStream = null, discardBtn = null;
function astat(msg){
  const e = $('astat');
  if (!msg) { e.hidden = true; e.textContent = ''; return; }
  e.hidden = false; e.textContent = msg;
}
function setMicIdle(){
  recording = false;
  $('mic').classList.remove('rec');
  $('mic').innerHTML = micIcon + T('audio_speak');
  if (discardBtn) { discardBtn.remove(); discardBtn = null; }
}
async function runTranscription(blob){
  if (audioBusy) return;
  audioBusy = true; $('mic').disabled = true; $('upl').disabled = true;
  try {
    const { transcribe } = await import('./audio.js');
    const text = await transcribe(blob, lang, (phase, pct) => {
      if (phase === 'model') astat(T('tr_model') + (pct != null ? ' ' + pct + '%' : ''));
      else if (phase === 'work') astat(T('tr_work'));
      else astat(T('tr_prep'));
    });
    if (text && text.length >= 2) {
      $('inp').value = text;
      astat(T('tr_done'));
      $('inp').focus();
    } else astat(T('tr_too_short'));
  } catch (e) {
    astat(T('tr_fail'));
  } finally {
    audioBusy = false; $('mic').disabled = false; $('upl').disabled = false;
  }
}
$('mic').onclick = async () => {
  if (recording) { if (rec && rec.state === 'recording') rec.stop(); return; }
  if (!micOK) { astat(T('tr_fail')); return; }
  try {
    astat(T('rec_starting'));
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    rec = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined);
    recChunks = []; discardRequested = false;
    rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop = () => {
      recStream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recChunks, { type: rec.mimeType || 'audio/webm' });
      setMicIdle();
      if (discardRequested) { discardRequested = false; astat(''); return; }
      if (blob.size) runTranscription(blob); else astat(T('tr_too_short'));
    };
    rec.start();
    recording = true;
    $('mic').classList.add('rec');
    $('mic').innerHTML = micIcon + T('rec_stop');
    discardBtn = document.createElement('button');
    discardBtn.className = 'ghost abtn';
    discardBtn.textContent = T('rec_discard');
    discardBtn.onclick = () => { discardRequested = true; if (rec && rec.state === 'recording') rec.stop(); };
    $('mic').after(discardBtn);
    astat('');
  } catch (e) {
    setMicIdle();
    astat(T('tr_fail'));
  }
};
$('upl').onclick = () => $('uplfile').click();
$('uplfile').onchange = () => { const f = $('uplfile').files[0]; $('uplfile').value = ''; if (f) runTranscription(f); };

// ---------- spoken result (on-device voices only) ----------
let speaking = false;
function pickVoice(){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices().filter(v => v.localService !== false);
  if (!vs.length) return null;
  const pref = { en: 'en', hi: 'hi', ml: 'ml' }[lang] || 'en';
  return vs.find(v => (v.lang || '').toLowerCase().indexOf(pref) === 0)
      || vs.find(v => (v.lang || '').toLowerCase().indexOf('en') === 0)
      || vs[0];
}
function refreshListen(){
  $('listen').classList.toggle('hidden', !pickVoice() || $('out').classList.contains('hidden'));
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = refreshListen;
function stopSpeaking(){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if (speaking) { speaking = false; $('listen').innerHTML = spkIcon + T('tts_listen'); }
}
$('listen').onclick = () => {
  if (speaking) { stopSpeaking(); return; }
  const v = pickVoice(); if (!v) return;
  const bits = [];
  bits.push($('vtext').textContent + '. ' + $('vsub').textContent);
  document.querySelectorAll('#siglist .tx').forEach(el => { if (el.childNodes[0]) bits.push(el.childNodes[0].textContent); });
  bits.push(T('next_steps') + '. ' + [$('t-step1').textContent, $('t-step2').textContent, $('t-step3').textContent].join(' '));
  speechSynthesis.cancel();
  speaking = true;
  $('listen').innerHTML = spkIcon + T('tts_stop');
  const done = () => { speaking = false; $('listen').innerHTML = spkIcon + T('tts_listen'); };
  bits.forEach((t, i) => {
    const u = new SpeechSynthesisUtterance(t);
    u.voice = v; u.lang = v.lang;
    if (i === bits.length - 1) { u.onend = done; u.onerror = done; }
    speechSynthesis.speak(u);
  });
};

async function fb(v){ try { await fetch('/api/feedback?v=' + v, { method: 'POST' }); } catch (e) {}
  $('t-helpful').textContent = T('thanks'); $('fby').remove(); $('fbn').remove(); }
$('fby').onclick = () => fb('yes'); $('fbn').onclick = () => fb('no');
(async () => { try { const c = await fetch('/api/count'); const j = await c.json(); if (j.count) { $('count').textContent = j.count; $('countwrap').classList.remove('hidden'); } } catch (e) {} })();
paint();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
